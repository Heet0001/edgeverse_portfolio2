<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Fog detection">
  <title>Fog detection</title>
  <!-- motorcycle (top-down, facing up) -->
  <line x1="32" y1="35" x2="32" y2="40" stroke-width="4.5"/>
  <line x1="24" y1="44" x2="40" y2="44"/>
  <rect x="28.5" y="42" width="7" height="16" rx="3.5"/>
  <line x1="32" y1="60" x2="32" y2="63.5" stroke-width="4.5"/>
  <!-- forward detection arcs -->
  <path d="M26.34 27.34 A8 8 0 0 1 37.66 27.34"/>
  <path d="M22.81 23.81 A13 13 0 0 1 41.19 23.81"/>
  <!-- fog banks -->
  <line x1="20" y1="4.5" x2="44" y2="4.5" stroke-width="2.5"/>
  <line x1="13" y1="10" x2="37" y2="10" stroke-width="2.5"/>
  <line x1="27" y1="15.5" x2="51" y2="15.5" stroke-width="2.5"/>
</svg>
