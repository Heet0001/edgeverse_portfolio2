<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Forward collision warning">
  <title>Forward collision warning</title>
  <!-- motorcycle (top-down, facing up) -->
  <line x1="32" y1="34" x2="32" y2="39" stroke-width="4.5"/>
  <line x1="24" y1="43" x2="40" y2="43"/>
  <rect x="28.5" y="41" width="7" height="16" rx="3.5"/>
  <line x1="32" y1="59" x2="32" y2="63" stroke-width="4.5"/>
  <!-- forward detection arcs -->
  <path d="M25.64 25.64 A9 9 0 0 1 38.36 25.64"/>
  <path d="M21.4 21.4 A15 15 0 0 1 42.6 21.4"/>
  <!-- warning triangle -->
  <path d="M32 3.5 L40 16 L24 16 Z" stroke-width="2.5"/>
  <line x1="32" y1="8.5" x2="32" y2="11.5" stroke-width="2.5"/>
  <circle cx="32" cy="13.8" r="1.3" fill="currentColor" stroke="none"/>
</svg>
