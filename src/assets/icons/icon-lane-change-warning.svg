<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Lane change warning">
  <title>Lane change warning</title>
  <!-- lane markings -->
  <line x1="12" y1="5" x2="12" y2="59" stroke-width="2.5"/>
  <line x1="52" y1="5" x2="52" y2="59" stroke-width="2.5"/>
  <line x1="32" y1="6" x2="32" y2="58" stroke-width="2.5" stroke-dasharray="6 6"/>
  <!-- motorcycle in right lane (top-down, facing up) -->
  <line x1="42" y1="32" x2="42" y2="36" stroke-width="4"/>
  <line x1="36" y1="39.5" x2="48" y2="39.5" stroke-width="2.5"/>
  <rect x="39.2" y="38" width="5.6" height="13" rx="2.8" stroke-width="2.5"/>
  <line x1="42" y1="53" x2="42" y2="57" stroke-width="4"/>
  <!-- lane change path -->
  <path d="M42 27 C42 19 34 15 25 15" stroke-width="2.5"/>
  <path d="M29 10.5 L24 15 L29 19.5" stroke-width="2.5"/>
  <!-- warning triangle in target lane -->
  <path d="M22 40.5 L28 50 L16 50 Z" stroke-width="2.5"/>
  <line x1="22" y1="44.2" x2="22" y2="46.4" stroke-width="2"/>
  <circle cx="22" cy="48.2" r="1.1" fill="currentColor" stroke="none"/>
</svg>
