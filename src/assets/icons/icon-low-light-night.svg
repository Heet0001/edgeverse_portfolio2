<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Low-light and night detection">
  <title>Low-light and night detection</title>
  <!-- motorcycle (top-down, facing up) -->
  <line x1="32" y1="34" x2="32" y2="39" stroke-width="4.5"/>
  <line x1="24" y1="43" x2="40" y2="43"/>
  <rect x="28.5" y="41" width="7" height="16" rx="3.5"/>
  <line x1="32" y1="59" x2="32" y2="63" stroke-width="4.5"/>
  <!-- forward detection arcs -->
  <path d="M25.64 25.64 A9 9 0 0 1 38.36 25.64"/>
  <path d="M21.4 21.4 A15 15 0 0 1 42.6 21.4"/>
  <!-- crescent moon -->
  <path d="M50.5 4.5 A9.5 9.5 0 1 0 59 15.5 A7.5 7.5 0 0 1 50.5 4.5 Z" stroke-width="2.5"/>
  <!-- stars -->
  <line x1="12" y1="6.5" x2="12" y2="11.5" stroke-width="2"/>
  <line x1="9.5" y1="9" x2="14.5" y2="9" stroke-width="2"/>
  <line x1="22" y1="14" x2="22" y2="18" stroke-width="2"/>
  <line x1="20" y1="16" x2="24" y2="16" stroke-width="2"/>
</svg>
