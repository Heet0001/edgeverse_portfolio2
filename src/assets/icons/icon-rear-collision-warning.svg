<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Rear collision warning">
  <title>Rear collision warning</title>
  <!-- motorcycle (top-down, facing up) -->
  <line x1="32" y1="1" x2="32" y2="5" stroke-width="4.5"/>
  <line x1="24" y1="9" x2="40" y2="9"/>
  <rect x="28.5" y="7" width="7" height="16" rx="3.5"/>
  <line x1="32" y1="25" x2="32" y2="30" stroke-width="4.5"/>
  <!-- rearward detection arcs -->
  <path d="M25.64 38.36 A9 9 0 0 0 38.36 38.36"/>
  <path d="M21.4 42.6 A15 15 0 0 0 42.6 42.6"/>
  <!-- warning triangle -->
  <path d="M32 48.5 L40 61 L24 61 Z" stroke-width="2.5"/>
  <line x1="32" y1="53.5" x2="32" y2="56.5" stroke-width="2.5"/>
  <circle cx="32" cy="58.8" r="1.3" fill="currentColor" stroke="none"/>
</svg>
